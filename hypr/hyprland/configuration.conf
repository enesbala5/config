#######################################################################################
# HYPR CONFIG
#######################################################################################
#
# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/monitors.conf

# Source the auto-generated monitors configuration
# Adjust the path to match your destination setting in config.toml
source = ~/.config/hypr/monitors.conf

################
### MONITORS ###
################
# See https://wiki.hyprland.org/Configuring/Monitors/
# Laptop Monitor
# Disabling Temporarily
# # Xiaomi Mi 34
# monitor=DP-3, 3440x1440@144.00, auto, 1
# # Dell U2415
# monitor=DP-3, 1920x1200@60, auto, 1
# unscale XWayland

xwayland {
	force_zero_scaling = true
}

experimental {
	xx_color_management_v4 = true
}

debug:disable_logs = false

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
# Set programs that you use
$terminal = kitty
$helium = helium
$textEditor = obsidian
$fileManager = thunar
$fileManagerSecondary = dolphin
$clipboardManager = vicinae vicinae://launch/clipboard/history
$clipboardManagerBackup = cliphist list | vicinae dmenu --placeholder "Select option" | cliphist decode | wl-copy

$codeEditor = zeditor

# $menu = sherlock
$menu = vicinae toggle

$emojiPicker = vicinae vicinae://launch/core/search-emojis
$webSearch = vicinae toggle


#################
### AUTOSTART ###\
#################
# Autostart necessary processes (like notifications daemons, status bars, etc.)

exec-once = sh -c '> ~/.config/hypr/monitors.conf' && hyprdynamicmonitors run
exec-once = waybar & waypaper --restore
exec-once = kdeconnect-indicator
exec-once = hyprsunset
exec-once = hypridle
exec-once = hyprlock --no-fade-in
exec-once = keymapper -c ~/config/tools/keymapper/configuration.conf --no-tray
exec-once = dunst
exec-once = systemctl --user start vicinae.service
exec-once = systemctl --user start easyeffects.service
exec-once = nm-applet --indicator
exec-once = handy --start-hidden
exec-once = aw-watcher-window-hyprland

# Clipboard: Only active if not using Vicinae (Vicinae runs its own clipboard server)
# exec-once = wl-paste --type text --watch cliphist store
# exec-once = wl-paste --type image --watch cliphist store


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_SIZE,12
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
	gaps_in = 5
	gaps_out = 5

	border_size = 2

	# https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
	col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
	col.inactive_border = rgba(595959aa)

	# Set to true enable resizing windows by clicking and dragging on borders and gaps
	resize_on_border = true

	# Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
	allow_tearing = false

	layout = dwindle
}

cursor {
	no_warps = true
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
	rounding = 10

	# Change transparency of focused and unfocused windows
	active_opacity = 1.0
	inactive_opacity = 1.0

	shadow {
		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}

	# https://wiki.hyprland.org/Configuring/Variables/#blur
	blur {
		enabled = true
		# size = 24
		# passes = 2

		# vibrancy = 0.3696

		size = 2
		passes = 3
		new_optimizations = on

		# Enable blur for overlays and popups
		popups = true
		popups_ignorealpha = 1
	}
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
	enabled = true

	# Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

	bezier = myBezier, 0.05, 0.9, 0.1, 1.05

	animation = windows, 1, 5, myBezier
	animation = windowsOut, 1, 5, default, popin 80%
	animation = border, 1, 10, default
	animation = borderangle, 1, 8, default
	animation = fade, 1, 5, default
	# animation = workspaces, 1, 6, default
	animation = workspaces, 1, 1, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
	pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
	preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
	new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
	force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
	disable_hyprland_logo = true

	vfr = false

	mouse_move_focuses_monitor = 0
}


#############
### INPUT ###
#############
# https://wiki.hyprland.org/Configuring/Variables/#input
input {
	kb_layout = us
	kb_variant =
	kb_model =
	kb_options =
	kb_rules =

	follow_mouse = 1

	# Touchpad !!!!
	sensitivity = -0.1 # -0.7 - 0.7, 0 means no modification.
	force_no_accel = true

	touchpad {
		natural_scroll = true
		scroll_factor = 0.25
	}
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gesture = 4, horizontal, workspace, distance: 300, cancel_ratio: 0.1

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
	name = logitech-g203-prodigy-gaming-mouse
	sensitivity = -1 # -1.0 - 1.0, 0 means no modification.
}


####################
### KEYBINDINGS ###
####################
# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# Terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Z, exec, $codeEditor
bind = $mainMod, H, exec, $helium

# bind = CTRL    ALT, right, exec, [direction r] $terminal # move to right
# bind = SUPER, E, exec, [workspace 2 silent; float; move 0 0] kitty

bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod CTRL SHIFT, B, exec, hyprdynamicmonitors run
bind = $mainMod CTRL SHIFT, L, exec, hyprctl reload
bind = $mainMod CTRL SHIFT, M, exec, hyprctl dispatch exec '[float; size 90% 80%; move 5% 10%;]' kitty "zsh -c '~/config/scripts/utilities/clear-monitor-config.sh; zsh -i'"
bind = $mainMod CTRL, ESCAPE, exec, hyprctl dispatch exec '[float; size 90% 80%; move 5% 10%;]' kitty btop
bind = $mainMod, ESCAPE, exec, dunstctl close

bind = $mainMod, X, exec, ~/config/scripts/audio/handy-bt-toggle.sh
bind = $mainMod, C, exec, ~/config/scripts/audio/handy-bt-toggle.sh --cancel

bind = $mainMod CTRL, L, exec, pidof hyprlock --no-fade-in || hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, $fileManagerSecondary
bind = $mainMod, N, exec, $textEditor
bind = $mainMod, M, exec, vicinae vicinae://launch/@dagimg-dot/store.vicinae.player-pilot/player-pilot

# Screenshot & Color Picker
bind = $mainMod SHIFT, S, exec, ~/config/scripts/utilities/screenshot.sh
bind = $mainMod CTRL SHIFT, I, exec, ~/config/scripts/utilities/color-picker.sh

bind = $mainMod, F, togglefloating,
bind = $mainMod CTRL, F, fullscreen,
bind = $mainMod, R, exec, vicinae vicinae://launch/system/run
bind = $mainMod SHIFT, R, exec, wofi -show run
bind = $mainMod, D, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod CTRL ALT SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL ALT SHIFT, right, movecurrentworkspacetomonitor, r
bind = $mainMod CTRL ALT SHIFT, up, movecurrentworkspacetomonitor, t
bind = $mainMod CTRL ALT SHIFT, down, movecurrentworkspacetomonitor, b

# Brightness
bind=, XF86MonBrightnessDown, exec, brillo -U 5 -e -u 150000
bind=, XF86MonBrightnessUp, exec, brillo -A 5 -e -u 150000

# Audio
bind =, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind =, XF86AudioMedia, exec, ~/config/scripts/utilities/toggle-polarity.sh

# Clipboard (Vicinae only)
bind = $mainMod, V, exec, $clipboardManager
bind = $mainMod SHIFT, V, exec, $clipboardManagerBackup
# bind = $mainMod SHIFT, V, exec, vicinae vicinae://launch/clipboard/history


bind = $mainMod, Period, exec, $emojiPicker
bind = $mainMod, S, exec, $webSearch

bind = $mainMod, Space, exec, $menu
bind = $mainMod SHIFT, Space, exec, wofi --show run

# to switch between windows in a floating workspace
bind = ALT, TAB, cyclenext, # change focus to another window
bind = ALT, TAB, bringactivetotop, # bring it to the top
bind = ALT SHIFT, TAB, cyclenext, prev # change focus to another window
bind = ALT SHIFT, TAB, bringactivetotop, # bring it to the top

bind = $mainMod, TAB, exec, vicinae vicinae://launch/wm/switch-windows

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Organize
bind = $mainMod CTRL SHIFT, left, movewindow, l
bind = $mainMod CTRL SHIFT, right, movewindow, r
bind = $mainMod CTRL SHIFT, up, movewindow, u
bind = $mainMod CTRL SHIFT, down, movewindow, d

# Resize Panes
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, up, resizeactive, 0 -100
bind = $mainMod SHIFT, down, resizeactive, 0 100

# Switch workspaces
# With Arrow Keys
bind = $mainMod CTRL, left, workspace, -1
bind = $mainMod CTRL, right, workspace, +1

# with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10
bind = $mainMod CTRL, S, movetoworkspace, special:magic

# Example special workspace (scratchpad)
bind = CTRL SHIFT , F6, togglespecialworkspace, magic
# bind = CTRL ALT SHIFT, P, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
# Transparency & Blur
windowrule = opacity 1 override 0.95 override 1 override, class:kitty
windowrule = opacity 0.85 override 0.80 override 0.85 override, class:org.kde.dolphin
windowrule = opacity 0.85 override 0.80 override 0.85 override, class:thunar
windowrule = opacity 0.95 override 0.90 override 0.95 override, class:(code)$
windowrule = opacity 0.95 override 0.90 override 0.95 override, title:.*Cursor.*
windowrule = opacity 0.95 override 0.90 override 0.95 override, class:(dev.zed.Zed-Nightly)$
windowrule = opacity 0.95 override 0.90 override 0.98 override, class:(obsidian)$
windowrule = opacity 0.9 override 0.85 override 0.98 override, title:.*Developer Tools.*
windowrule = opacity 0.9 override 0.85 override 0.98 override, title:.*DevTools.*

windowrule = suppressevent maximize, class:(.*) # Recommended by documentation

# Zen Picture in Picture
windowrule = float, title:(Picture-in-Picture)
windowrule = noinitialfocus, title:(Picture-in-Picture)
windowrule = size 324 181, title:(Picture-in-Picture)
windowrule = move 100%-329 100%-212, title:(Picture-in-Picture)
windowrule = pin, title:(Picture-in-Picture)
windowrule = animation slide right, title:(Picture-in-Picture)

# Chromium Picture in Picture
windowrule = float, title:(Picture in picture)
windowrule = noinitialfocus, title:(Picture in picture)
windowrule = size 324 181, title:(Picture in picture)
windowrule = move 100%-329 100%-212, title:(Picture in picture)
windowrule = pin, title:(Picture in picture)
windowrule = animation slide right, title:(Picture in picture)

windowrule = float, class:(org.gnome.Calculator)
windowrule = size 450 704, class:(org.gnome.Calculator)
windowrule = center, class:(org.gnome.Calculator)

windowrule = float, class:(Proton Pass)
windowrule = size 1200 850, class:(Proton Pass)
windowrule = center, class:(Proton Pass)

# Waypaper
windowrule = float, class:waypaper
windowrule = noinitialfocus, class:waypaper
windowrule = size 50% 60%, class:waypaper
windowrule = center, class:waypaper

# Popups
windowrule = center, class:(Cursor)$
windowrule = center, class:(Code)$
windowrule = center, class:(dev.zed.Zed-Nightly)$
windowrule = float, title:(Zed — Settings)

# Affinity Panels
windowrule = tile, class:^(affinity.exe)

# Dev Tools
windowrule = tile, title:(Developer Tools)
windowrule = tile, title:(DevTools)

# Other
windowrule = tile, initialTitle:^(Wage Visualizer)
windowrule = fullscreen, initialClass:^(.qemu-system-x86_64-wrapped)

# Layer Rules
layerrule=blur, zen
layerrule=blur, org.kde.dolphin
layerrule=blur, thunar

layerrule=blur, vicinae
layerrule=blurpopups, vicinae
layerrule=ignorealpha 0, vicinae
layerrule=dimaround, vicinae

layerrule=blur, chrome
layerrule=ignorealpha, chrome
layerrule=dimaround, chrome

layerrule=blur, ^(affinity.exe)
layerrule=ignorealpha, ^(affinity.exe)
layerrule=dimaround, ^(affinity.exe)


# disable fade animation for vicinae only
layerrule = noanim, vicinae

layerrule=blur, waybar
layerrule=ignorealpha, waybar

layerrule=blur, notifications

windowrulev2 = idleinhibit fullscreen, class:.*
windowrulev2 = idleinhibit fullscreen, title:.*
windowrulev2 = idleinhibit fullscreen, fullscreen:1
