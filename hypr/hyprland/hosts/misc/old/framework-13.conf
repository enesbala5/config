# Host-specific Hyprland config for framework-13
# Read by the running 0.51 session. 0.56 loads hosts/framework-13.lua.

exec-once = kdeconnect-indicator
exec-once = hyprsunset
exec-once = systemctl --user start easyeffects.service
exec-once = systemctl --user start vicinae.service
exec-once = aw-watcher-window-hyprland

bind = $mainMod, Space, exec, $menu
bind = $mainMod SHIFT, Space, exec, wofi --show run
bind = $mainMod, TAB, exec, vicinae vicinae://launch/wm/switch-windows
