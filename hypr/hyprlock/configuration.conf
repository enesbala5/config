# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

general {
	hide_cursor = false
}

auth {
	pam {
		enabled = true
		module = "hyprlock"
	}

	fingerprint {
		enabled = true
		ready_message = Scan fingerprint to unlock
		present_message = Scanning...
		retry_delay = 250 # milliseconds
	}
}

animations {
	enabled = true
	bezier = linear, 1, 1, 0, 0

	# animation = fadeIn, 0
	# animation = fadeOut, 0

	animation = fadeIn, 1, 3, linear
	animation = fadeOut, 1, 3, linear
	animation = inputFieldDots, 1, 2, linear
}

background {
	monitor =
	path = $HOME/config/wallpapers/distortion-1.png
	color = rgba(0, 0, 0, 0.75)

	# all these options are tapken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
	blur_passes = 3 # 0 disables blurring
	blur_size = 4
	# noise = 0
	# contrast = 0
	# brightness = 0
	# vibrancy = 0
	# vibrancy_darkness = 0.0
}

input-field {
	monitor =
	size = 10%, 3%

	outline_thickness = 2

	font_family = Geist Medium

	inner_color = rgba(0, 0, 0, 0.0) # no fill
	# border_color = rgba(0, 0, 0, 0.0) # no fill
	# border_color = rgba(255, 255, 255, 0.0)

	outer_color = rgba(255, 255, 255, 0.05) rgba(205, 205, 205, 0.05) 45deg
	check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
	fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
	font_color = rgb(143, 143, 143)


	rounding = 999

	halign = center
	valign = bottom;
	position = 0, 190

	fade_on_empty = false
}

# Top bar: left — now playing
label {
	monitor =
	text = cmd[update:2000] $HOME/config/scripts/music/get_song_status.sh
	color = rgba(242, 243, 244, 0.75)
	font_size = 14
	font_family = Geist
	position = 15, -15
	halign = left
	valign = top
}

# Top bar: right — network · battery
label {
	monitor =
	text = cmd[update:5000] $HOME/config/scripts/network/get_network_status.sh
	color = rgba(242, 243, 244, 0.75)
	font_size = 14
	font_family = Geist
	position = -80, -15
	halign = right
	valign = top
}

label {
	monitor =
	text = ·
	color = rgba(242, 243, 244, 0.75)
	font_size = 14
	font_family = Geist
	position = -65, -15
	halign = right
	valign = top
}

label {
	monitor =
	text = cmd[update:1000] $HOME/config/scripts/power/get_battery.sh
	color = rgba(242, 243, 244, 0.75)
	font_size = 14
	font_family = Geist
	position = -15, -15
	halign = right
	valign = top
}

label {
	monitor =
	text = cmd[update:1000] echo "$(date +"%A, %B %d")"
	color = rgba(242, 243, 244, 0.75)
	font_size = 20
	font_family = Geist Bold
	position = 0, 485
	halign = center
	valign = center
}

label {
	monitor =
	text = cmd[update:1000] echo "$(date +"%k:%M")"
	color = rgba(242, 243, 244, 0.93)
	font_size = 150
	font_family = Geist Bold
	position = 0, 350
	halign = center
	valign = center
}


label {
	monitor =
	text = $USER_FULL_NAME
	color = rgba(242, 243, 244, 0.75)

	font_size = 14
	font_family = Geist Bold

	position = 0, 300
	halign = center
	valign = bottom
}

label {
	monitor =
	text = Fingerprint or Password
	color = rgba(242, 243, 244, 0.75)
	font_size = 12
	font_family = Geist
	position = 0, 270
	halign = center
	valign = bottom
}

image {
	monitor =
	path = ~/config/branding/icon.jpg
	border_color = 0xffdddddd
	border_size = 0
	size = 73
	rounding = -1
	rotate = 0
	reload_time = -1
	reload_cmd =
	position = 0, 340
	halign = center
	valign = bottom
}
