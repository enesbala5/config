onboarding = false

[terminal]
kitty_graphics = true

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false

# Agents panel.
#
# Herdr's sidebar separator is hardcoded (src/ui/sidebar/tokens.rs): every pair
# of adjacent tokens is joined with " · ", except a single space after the
# built-in state_icon. There is no config key to change it, so a custom token
# like $spin can never sit flush against the tab title.
#
# Therefore: state_icon owns the leading, divider-free icon slot (it renders
# every state: working ◐, done ✓, idle ○, blocked ×, unknown ·), and the
# animated $spin lives at the start of line 2.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "tab"],
  [{ token = "$spin", fg = "#fab387", bold = true, dim = false }, "agent", "workspace"],
]

