onboarding = false

[terminal]
kitty_graphics = true

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false

# Agents panel: line 1 = status + tab title, line 2 = [spin] agent · workspace.
# Tokens in one row are hard-separated with " · "; there is no per-row
# separator setting, so " - " is not possible without faking a token.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "tab"],
  [{ token = "$spin", fg = "#fab387", bold = true, dim = false }, "agent", "workspace"],
]

