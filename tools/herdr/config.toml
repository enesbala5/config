onboarding = false

[terminal]
kitty_graphics = true

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false

# Agents panel.
#
# Herdr's sidebar separator is hardcoded (src/ui/sidebar/tokens.rs): every pair
# of adjacent tokens is joined with " · ", except a single space after the
# built-in state_icon. So a custom glyph can never sit flush against the tab
# title. The local `agent-head` plugin sidesteps this by emitting the glyph and
# the title as ONE custom token ($head), so there is nothing to separate.
#
# $head = "<state glyph> <tab title>", animated while working:
#   working  braille spinner   done ✓   idle ○   blocked ×   unknown ·
#
# $vendor = "<logo> <agent name>" (or the name alone when the icon font has
# no mark). Same one-token trick, so the logo sits against the name.
#
# The per-state `rules` tint the whole token, title included. Delete the rules
# (leave just { token = "$head" }) for a neutral title; the glyph shape still
# distinguishes states.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    { token = "$head", rules = [
      { starts_with = "⣾", fg = "#fab387" },
      { starts_with = "⣽", fg = "#fab387" },
      { starts_with = "⣻", fg = "#fab387" },
      { starts_with = "⢿", fg = "#fab387" },
      { starts_with = "⡿", fg = "#fab387" },
      { starts_with = "⣟", fg = "#fab387" },
      { starts_with = "⣯", fg = "#fab387" },
      { starts_with = "⣷", fg = "#fab387" },
      { starts_with = "✓", fg = "#a6e3a1" },
      { starts_with = "×", fg = "#f38ba8" },
      { starts_with = "○", fg = "#9399b2", dim = true },
      { starts_with = "·", fg = "#6c7086", dim = true },
    ] },
  ],
  ["$vendor", "workspace"],
]

# [keys]
# next_tab = "prefix+ctrl+tab"
# previous_tab = "prefix+ctrl+shift+tab"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

# Ctrl+P and Ctrl+Alt+P cannot share herdr-bar.open: that action has one
# scope in config.json. open.sh copies that config and sets scope per chord.
# Kitty turns physical Ctrl+Shift+P into this Ctrl+Alt+P sequence. Herdr does
# not bind Ctrl+Shift+P. Popup size matches the plugin manifest (74% x 62%).
[[keys.command]]
key = "ctrl+p"
type = "popup"
command = 'root=$(dirname "$(readlink -f "$HOME/.config/herdr/config.toml")"); exec "$root/plugins/herdr-bar/open.sh" pane'
description = "panes (%)"
width = "74%"
height = "62%"

[[keys.command]]
key = "ctrl+alt+p"
type = "popup"
command = 'root=$(dirname "$(readlink -f "$HOME/.config/herdr/config.toml")"); exec "$root/plugins/herdr-bar/open.sh" agent'
description = "agents (@)"
width = "74%"
height = "62%"
